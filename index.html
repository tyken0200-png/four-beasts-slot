<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOUR BEASTS</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 35%,
            #172342 0%,
            #090d18 42%,
            #030407 100%
        );

    color:white;
}

/* =========================================
   BACKGROUND LIGHTS
========================================= */

body::before{
    content:"";

    position:fixed;

    inset:-30%;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 40%,
            rgba(255,30,45,.22),
            transparent 24%
        ),
        radial-gradient(
            circle at 85% 40%,
            rgba(255,180,20,.2),
            transparent 24%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(0,120,255,.15),
            transparent 35%
        );
}

/* =========================================
   MACHINE
========================================= */

.machine{

    position:relative;

    width:min(1080px,96vw);

    padding:
        24px
        clamp(10px,3vw,40px)
        28px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #080a10,
            #202734 20%,
            #080a0f 48%,
            #171d28 78%,
            #050609
        );

    border:
        5px solid #d4a93f;

    box-shadow:

        0 0 0 2px #513b0d,

        0 0 20px rgba(255,210,70,.28),

        0 0 80px rgba(0,100,255,.14),

        0 30px 100px rgba(0,0,0,.95),

        inset 0 0 45px rgba(0,0,0,.9);

    z-index:5;

    transition:
        transform .1s;
}

.machine::before{

    content:"";

    position:absolute;

    inset:9px;

    border:
        1px solid rgba(255,220,100,.5);

    border-radius:20px;

    pointer-events:none;
}

/* =========================================
   LED
========================================= */

.leds{

    position:absolute;

    top:12px;

    left:18px;
    right:18px;

    display:flex;

    justify-content:space-between;

    pointer-events:none;
}

.led{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffe899;

    box-shadow:
        0 0 5px white,
        0 0 12px #ffc400,
        0 0 24px #ff8c00;

    animation:
        blink .7s infinite alternate;
}

.led:nth-child(2n){
    animation-delay:.12s;
}

.led:nth-child(3n){
    animation-delay:.23s;
}

.led:nth-child(4n){
    animation-delay:.35s;
}

@keyframes blink{

    from{
        opacity:.25;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.25);
    }
}

/* =========================================
   HEADER
========================================= */

.brand{

    text-align:center;

    color:#d5b65a;

    font-size:9px;

    letter-spacing:7px;

    margin-top:4px;
}

.title{

    margin:
        8px 0 0;

    text-align:center;

    font-size:
        clamp(40px,7vw,76px);

    font-weight:1000;

    letter-spacing:
        clamp(2px,1vw,8px);

    line-height:.9;

    background:
        linear-gradient(
            180deg,
            #fff9ca,
            #e8c65a 42%,
            #fff0a0 60%,
            #9b6417
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 4px 0 #271600
        )
        drop-shadow(
            0 0 18px rgba(255,205,60,.5)
        );
}

.subtitle{

    margin-top:12px;

    text-align:center;

    color:#8793a9;

    font-size:9px;

    letter-spacing:5px;
}

/* =========================================
   JACKPOT DISPLAY
========================================= */

.jackpots{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

    margin:
        18px auto 14px;

    max-width:780px;
}

.jackpot{

    padding:7px 4px;

    text-align:center;

    border:
        1px solid #66521d;

    background:
        linear-gradient(
            #0d1119,
            #050609
        );

    box-shadow:
        inset 0 0 12px #000;
}

.jackpot .label{

    display:block;

    font-size:7px;

    letter-spacing:2px;

    color:#747f91;
}

.jackpot .amount{

    display:block;

    margin-top:2px;

    color:#f3d873;

    font-family:
        "Courier New",
        monospace;

    font-weight:900;

    font-size:
        clamp(12px,2vw,18px);

    text-shadow:
        0 0 8px rgba(255,200,40,.7);
}

/* =========================================
   ORNAMENT
========================================= */

.ornament{

    display:flex;

    align-items:center;

    gap:14px;

    margin:
        14px 0;
}

.line{

    flex:1;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a77b25,
            #ffe48b,
            #a77b25,
            transparent
        );
}

.diamond{

    color:#e6c55b;

    text-shadow:
        0 0 15px #ffc400;
}

/* =========================================
   REEL FRAME
========================================= */

.reel-frame{

    padding:10px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #5d4515,
            #f0cf62,
            #765817,
            #d9b34a,
            #4b350e
        );

    border:4px solid #c89c35;

    box-shadow:

        inset 0 0 20px #080703,

        0 0 25px rgba(255,205,70,.2);
}

.reel-inner{

    padding:7px;

    background:#020307;

    border:
        2px solid #5e4b1d;

    box-shadow:
        inset 0 0 25px #000;
}

/* =========================================
   REELS
========================================= */

.reels{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;
}

.slot{

    position:relative;

    height:
        clamp(145px,21vw,225px);

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #f9f9f9,
            #d8d8d8 45%,
            #b9b9b9
        );

    border:
        3px solid #a17b25;

    border-radius:6px;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.65);

    transition:
        box-shadow .15s;
}

.slot.spinning{

    box-shadow:

        inset 0 0 30px rgba(0,0,0,.7),

        0 0 18px rgba(255,211,70,.7);
}

.reel{

    position:absolute;

    top:0;
    left:0;

    width:100%;

    will-change:
        transform;

    backface-visibility:hidden;
}

.symbol{

    height:
        clamp(145px,21vw,225px);

    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:
        clamp(68px,10vw,115px);

    user-select:none;

    filter:
        drop-shadow(
            0 7px 5px rgba(0,0,0,.4)
        );
}

/* =========================================
   GLASS
========================================= */

.slot::before{

    content:"";

    position:absolute;

    inset:0;

    z-index:10;

    pointer-events:none;

    background:
        linear-gradient(
            105deg,
            rgba(255,255,255,.3),
            transparent 18%,
            transparent 72%,
            rgba(255,255,255,.1)
        );
}

.slot::after{

    content:"";

    position:absolute;

    inset:0;

    z-index:11;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.28),
            transparent 20%,
            transparent 80%,
            rgba(0,0,0,.28)
        );
}

/* =========================================
   PAYLINE
========================================= */

.payline{

    position:absolute;

    z-index:20;

    left:0;
    right:0;

    top:50%;

    height:2px;

    transform:
        translateY(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            #ffe369,
            white,
            transparent
        );

    box-shadow:
        0 0 7px white,
        0 0 15px #ffc400;

    pointer-events:none;
}

/* =========================================
   RESULT
========================================= */

.result{

    height:58px;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:#d7bf6d;

    font-size:
        clamp(14px,2.5vw,21px);

    font-weight:900;

    letter-spacing:3px;

    text-shadow:
        0 0 12px rgba(255,200,40,.5);
}

.result.jackpot{

    color:#fff;

    font-size:
        clamp(28px,5vw,58px);

    animation:
        jackpotText .35s infinite alternate;
}

@keyframes jackpotText{

    from{
        transform:scale(1);

        text-shadow:
            0 0 10px white,
            0 0 25px #ffd400;
    }

    to{
        transform:scale(1.1);

        text-shadow:
            0 0 10px white,
            0 0 35px #ffd400,
            0 0 70px #ff4d00;
    }
}

/* =========================================
   GO BUTTON
========================================= */

.go-wrap{

    display:flex;

    justify-content:center;

    margin-top:4px;
}

.go{

    width:
        clamp(190px,32vw,280px);

    height:
        clamp(58px,8vw,76px);

    border:
        3px solid #f5d76b;

    border-radius:13px;

    cursor:pointer;

    color:#250c02;

    font-size:
        clamp(24px,4vw,36px);

    font-weight:1000;

    letter-spacing:8px;

    background:
        linear-gradient(
            180deg,
            #fff6b7,
            #e5b437 44%,
            #874309
        );

    box-shadow:

        0 7px 0 #2b0b03,

        0 12px 30px rgba(0,0,0,.8),

        0 0 30px rgba(255,200,40,.3);

    transition:
        filter .1s,
        transform .1s;
}

.go:hover{

    filter:
        brightness(1.16);

    box-shadow:

        0 7px 0 #2b0b03,

        0 15px 35px rgba(0,0,0,.8),

        0 0 45px rgba(255,215,60,.65);
}

.go:active{

    transform:
        translateY(6px);
}

.go:disabled{

    cursor:not-allowed;

    filter:
        brightness(.55);
}

/* =========================================
   JACKPOT OVERLAY
========================================= */

.overlay{

    position:fixed;

    inset:0;

    z-index:100;

    pointer-events:none;

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(255,235,100,.5),
            transparent 60%
        );
}

.overlay.show{

    animation:
        overlayFlash 3s ease-out;
}

@keyframes overlayFlash{

    0%{
        opacity:0;
    }

    8%{
        opacity:1;
    }

    35%{
        opacity:.75;
    }

    100%{
        opacity:0;
    }
}

.jackpot-message{

    text-align:center;

    transform:
        scale(.2)
        rotate(-8deg);

    opacity:0;
}

.overlay.show
.jackpot-message{

    animation:
        jackpotPop 3s cubic-bezier(.1,.8,.2,1);
}

.congrats{

    display:block;

    color:#fff4a8;

    font-size:
        clamp(15px,3vw,30px);

    font-weight:1000;

    letter-spacing:8px;
}

.jackpot-big{

    display:block;

    margin-top:4px;

    font-size:
        clamp(58px,12vw,150px);

    line-height:.85;

    font-style:italic;

    font-weight:1000;

    color:white;

    text-shadow:

        0 5px 0 #a64d00,

        0 10px 0 #421200,

        0 0 15px white,

        0 0 35px #ffe600,

        0 0 70px #ff7800,

        0 0 120px #ff174d;
}

@keyframes jackpotPop{

    0%{
        opacity:0;

        transform:
            scale(.1)
            rotate(-12deg);
    }

    10%{
        opacity:1;

        transform:
            scale(1.25)
            rotate(3deg);
    }

    20%{
        transform:
            scale(.9)
            rotate(-2deg);
    }

    30%{
        transform:
            scale(1.08)
            rotate(1deg);
    }

    42%{
        transform:
            scale(1)
            rotate(0);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            scale(1.2);
    }
}

/* =========================================
   FLASH
========================================= */

.flash{

    position:fixed;

    inset:0;

    z-index:90;

    pointer-events:none;

    opacity:0;
}

.flash.show{

    animation:
        flash .5s ease-out;
}

@keyframes flash{

    0%{
        opacity:0;

        background:white;
    }

    12%{
        opacity:.9;
    }

    100%{
        opacity:0;
    }
}

/* =========================================
   PARTICLES
========================================= */

#particles{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:80;

    pointer-events:none;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:650px){

    .machine{

        padding:
            22px 7px 23px;

        border-width:3px;
    }

    .brand{
        letter-spacing:4px;
    }

    .subtitle{
        letter-spacing:2px;
    }

    .jackpots{
        gap:3px;
    }

    .jackpot{
        padding:5px 2px;
    }

    .reel-frame{
        padding:5px;
        border-width:3px;
    }

    .reel-inner{
        padding:4px;
    }

    .reels{
        gap:3px;
    }

    .slot{
        border-width:2px;
    }

    .led{
        width:5px;
        height:5px;
    }
}
</style>
</head>

<body>

<main

    <!-- LED -->

    <div class="leds">

        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>
        <span class="led"></span>

    </div>


    <div class="brand">

    </div>


    <h1 class="title">

    </h1>


    <div class="subtitle">
        DRAGON · TIGER · TURTLE · PHOENIX
    </div>


    <!-- JACKPOT -->

    <div class="jackpots">

        <div class="jackpot">

        </div>

        <div class="jackpot">

        </div>

        </div>

        <div class="reel-inner">

            <div class="reels">


                <div

<script>

/* =================================================
   SYMBOLS
================================================= */

const SYMBOLS = [
    "🐉",
    "🐯",
    "🐢",
    "🔥"
];


/* =================================================
   DOM
================================================= */

const reels =
    [0,1,2,3].map(
        i =>
            document.getElementById(
                "reel"+i
            )
    );


const slots =
    [0,1,2,3].map(
        i =>
            document.getElementById(
                "slot"+i
            )
    );


const button =
    document.getElementById("go");


const result =
    document.getElementById("result");


const machine =
    document.getElementById("machine");


const overlay =
    document.getElementById("overlay");


const flash =
    document.getElementById("flash");


const canvas =
    document.getElementById("particles");


const ctx =
    canvas.getContext("2d");


let audioContext = null;

let spinAudio = null;

let spinTimer = null;

let playing = false;

let particles = [];


/* =================================================
   AUDIO
================================================= */

function getAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


/* =================================================
   CREATE CLICK
================================================= */

function reelClick(
    volume = .05,
    frequency = 150
){

    const ac =
        getAudio();


    const osc =
        ac.createOscillator();


    const gain =
        ac.createGain();


    osc.type =
        "square";


    osc.frequency.value =
        frequency +
        Math.random()*80;


    gain.gain.setValueAtTime(
        .0001,
        ac.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        ac.currentTime+.002
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ac.currentTime+.035
    );


    osc.connect(gain);

    gain.connect(
        ac.destination
    );


    osc.start();

    osc.stop(
        ac.currentTime+.04
    );
}


/* =================================================
   SPIN SOUND
================================================= */

function startSpinSound(){

    stopSpinSound();


    const ac =
        getAudio();


    let interval =
        30;


    /*
       빠른 시작음
    */

    spinTimer =
        setInterval(
            () => {

                reelClick(
                    .075,
                    125
                );

            },
            interval
        );


    /*
       별도 저음 레이어
       -> 기계가 실제로 도는 느낌
    */

    const osc =
        ac.createOscillator();


    const gain =
        ac.createGain();


    osc.type =
        "sawtooth";


    osc.frequency.value =
        58;


    gain.gain.value =
        .025;


    osc.connect(gain);

    gain.connect(
        ac.destination
    );


    osc.start();


    spinAudio = {
        osc,
        gain
    };
}


/* =================================================
   STOP SPIN SOUND
================================================= */

function stopSpinSound(){

    if(spinTimer){

        clearInterval(
            spinTimer
        );

        spinTimer = null;
    }


    if(spinAudio){

        try{

            const ac =
                getAudio();


            spinAudio.gain.gain.exponentialRampToValueAtTime(
                .0001,
                ac.currentTime+.15
            );


            spinAudio.osc.stop(
                ac.currentTime+.18
            );

        }catch(e){}


        spinAudio = null;
    }
}


/* =================================================
   METAL TING
================================================= */

function metalTing(
    strength = 1
){

    const ac =
        getAudio();


    /*
       여러 고조파를 겹쳐
       금속판을 치는 느낌.
    */

    [
        740,
        1480,
        2220,
        2960
    ].forEach(
        (frequency,index) => {

            const osc =
                ac.createOscillator();


            const gain =
                ac.createGain();


            const start =
                ac.currentTime +
                index*.004;


            osc.type =
                "sine";


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                .001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                (
                    index === 0
                        ? .20
                        : .07
                ) * strength,
                start+.006
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                start+.6
            );


            osc.connect(gain);

            gain.connect(
                ac.destination
            );


            osc.start(start);

            osc.stop(
                start+.65
            );

        }
    );
}


/* =================================================
   JACKPOT SOUND
================================================= */

function jackpotSound(){

    const ac =
        getAudio();


    /*
       점점 올라가는 카지노식
       상승 멜로디.
    */

    const notes = [
        392,
        494,
        587,
        659,
        784,
        988,
        1175,
        1319
    ];


    notes.forEach(
        (frequency,index) => {

            const osc =
                ac.createOscillator();


            const gain =
                ac.createGain();


            const start =
                ac.currentTime +
                index*.095;


            osc.type =
                "triangle";


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                .001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .14,
                start+.025
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                start+.42
            );


            osc.connect(gain);

            gain.connect(
                ac.destination
            );


            osc.start(start);

            osc.stop(
                start+.45
            );

        }
    );


    /*
       JACKPOT 화음
    */

    setTimeout(
        () => {

            [
                523,
                659,
                784,
                1047,
                1319
            ].forEach(
                frequency => {

                    const osc =
                        ac.createOscillator();


                    const gain =
                        ac.createGain();


                    osc.type =
                        "sine";


                    osc.frequency.value =
                        frequency;


                    gain.gain.setValueAtTime(
                        .001,
                        ac.currentTime
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        .14,
                        ac.currentTime+.03
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        .001,
                        ac.currentTime+.9
                    );


                    osc.connect(gain);

                    gain.connect(
                        ac.destination
                    );


                    osc.start();

                    osc.stop(
                        ac.currentTime+1
                    );

                }
            );

        },
        850
    );
}


/* =================================================
   WAIT
================================================= */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =================================================
   RANDOM
================================================= */

function randomSymbol(){

    return SYMBOLS[
        Math.floor(
            Math.random() *
            SYMBOLS.length
        )
    ];
}


/* =================================================
   BUILD REEL
================================================= */

function buildReel(
    reel,
    finalSymbol
){

    reel.innerHTML = "";


    /*
       릴 길이.
    */

    const total =
        80;


    for(
        let i=0;
        i<total;
        i++
    ){

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "symbol";


        /*
           마지막 칸은 반드시
           실제 결과.
        */

        element.textContent =
            i === total-1
                ? finalSymbol
                : randomSymbol();


        reel.appendChild(
            element
        );
    }


    return total-1;
}


/* =================================================
   SPIN REEL
================================================= */

function spinReel(
    index,
    finalSymbol,
    duration
){

    return new Promise(
        resolve => {

            const reel =
                reels[index];


            const slot =
                slots[index];


            const finalIndex =
                buildReel(
                    reel,
                    finalSymbol
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            /*
               마지막 심볼을
               정확하게 중앙에 놓는다.
            */

            const target =
                -(
                    finalIndex * height
                ) +
                (
                    slot.clientHeight -
                    height
                ) / 2;


            const start =
                performance.now();


            slot.classList.add(
                "spinning"
            );


            function frame(now){

                const elapsed =
                    now - start;


                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );


                /*
                   빠르게 출발
                   마지막에 부드럽게 감속
                */

                const eased =
                    1 -
                    Math.pow(
                        1-progress,
                        5
                    );


                const position =
                    target * eased;


                reel.style.transform =
                    `translate3d(
                        0,
                        ${position}px,
                        0
                    )`;


                if(progress < 1){

                    requestAnimationFrame(
                        frame
                    );

                }else{

                    /*
                       최종 위치 고정
                    */

                    reel.style.transform =
                        `translate3d(
                            0,
                            ${target}px,
                            0
                        )`;


                    slot.classList.remove(
                        "spinning"
                    );


                    /*
                       릴 정지음
                    */

                    metalTing(
                        index === 3
                            ? 1.45
                            : 1
                    );


                    resolve();
                }
            }


            requestAnimationFrame(
                frame
            );

        }
    );
}


/* =================================================
   PARTICLES
================================================= */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}


resizeCanvas();


window.addEventListener(
    "resize",

/* =================================================
   COINS
================================================= */

function createCoins(){

    const rect =
        machine.getBoundingClientRect();


    for(
        let i=0;
        i<260;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            Math.random()*14+5;


        particles.push({

            x:
                rect.left +
                rect.width/2,

            y:
                rect.top +
                rect.height/2,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random()*7+3,

            life:1,

            rotation:
                Math.random()*6,

            spin:
                Math.random()*.25+.08
        });
    }
}


/* =================================================
   PARTICLE LOOP
================================================= */

function particleLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );


    particles.forEach(
        particle => {

            particle.x +=
                particle.vx;


            particle.y +=
                particle.vy;


            particle.vy +=
                .23;


            particle.rotation +=
                particle.spin;


            particle.life -=
                .012;


            ctx.save();


            ctx.globalAlpha =
                particle.life;


            ctx.translate(
                particle.x,
                particle.y
            );


            ctx.rotate(
                particle.rotation
            );


            ctx.fillStyle =
                "#ffd84a";


            ctx.fillRect(
                -particle.size,
                -particle.size*.55,
                particle.size*2,
                particle.size*1.1
            );


            ctx.restore();

        }
    );


    requestAnimationFrame(
        particleLoop
    );
}


particleLoop();

/* =================================================
   GAME
================================================= */

async function startGame(){

    if(playing)
        return;


    playing = true;

    button.disabled = true;


    result.classList.remove(
        "jackpot"
    );


    result.textContent =
        "GOOD LUCK...";


    /*
       브라우저 오디오 활성화
    */

    const ac =
        getAudio();


    if(ac.state === "suspended"){

        await ac.resume();
    }


    /*
       =========================================
       결과를 먼저 결정한다.
       화면도 이 값을 사용한다.
       =========================================
    */

    let results;


    /*
       테스트하기 편하게
       가끔 JACKPOT이 나오도록 설정.

       확률은 1/64.
    */

    const jackpotChance =
        Math.random() < 1/64;


    if(jackpotChance){

        const symbol =
            randomSymbol();


        results = [
            symbol,
            symbol,
            symbol,
            symbol
        ];

    }else{

        results = [
            randomSymbol(),
            randomSymbol(),
            randomSymbol(),
            randomSymbol()
        ];


        /*
           혹시 일반 결과가 우연히
           4개 동일이면 그대로 JACKPOT.
        */

    }


    /*
       =========================================
       회전 시작
       =========================================
    */

    startSpinSound();


    /*
       1번째 릴
    */

    await spinReel(
        0,
        results[0],
        950
    );


    await wait(70);


    /*
       2번째
    */

    await spinReel(
        1,
        results[1],
        1150
    );


    await wait(70);


    /*
       3번째
    */

    await spinReel(
        2,
        results[2],
        1350
    );


    await wait(70);


    /*
       4번째

       가장 오래 끌어서
       마지막 긴장감을 만든다.
    */

    await spinReel(
        3,
        results[3],
        1650
    );


    /*
       모든 릴 정지
    */

    stopSpinSound();


    await wait(350);


    /*
       =========================================
       당첨 판정
       =========================================

       중요:
       results는 실제 화면을 만들 때 사용한
       바로 그 값이다.
    */

    const jackpot =
        results[0] === results[1] &&
        results[1] === results[2] &&
        results[2] === results[3];


    if(jackpot){

        jackpotEffect();

    }else{

        result.textContent =
            "★ BETTER LUCK NEXT TIME ★";
    }


    playing = false;

    button.disabled = false;
}


/* =================================================
   INITIAL
================================================= */

function initialize(){

    const initial = [
        "🐉",
        "🐯",
        "🐢",
        "🔥"
    ];


    reels.forEach(
        (reel,index) => {

            const finalIndex =
                buildReel(
                    reel,
                    initial[index]
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            const slot =
                slots[index];


            const target =
                -(
                    finalIndex * height
                ) +
                (
                    slot.clientHeight -
                    height
                ) / 2;


            reel.style.transform =
                `translate3d(
                    0,
                    ${target}px,
                    0
                )`;
        }
    );
}


/* =================================================
   GO
================================================= */

button.addEventListener(
    "click",
    startGame
);


initialize();
