<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOUR BEASTS</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background:
        radial-gradient(
            ellipse at 50% 35%,
            #50151a 0%,
            #210b12 38%,
            #08070b 75%,
            #020204 100%
        );

    color: white;
}

/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 15% 30%,
            rgba(255, 30, 90, .16),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 30%,
            rgba(255, 190, 30, .15),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(160, 20, 40, .2),
            transparent 45%
        );

    z-index: -2;
}

/* Vegas 네온 */

.neon-left,
.neon-right {
    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(90px);

    opacity: .18;

    z-index: -1;
}

.neon-left {
    left: -120px;
    top: 10%;

    background: #ff1768;
}

.neon-right {
    right: -120px;
    top: 15%;

    background: #ffc928;
}


/* =====================================================
   MACHINE
===================================================== */

.machine {
    position: relative;

    width: min(1050px, 94vw);

    padding:
        32px
        clamp(18px, 4vw, 50px)
        38px;

    border: 6px solid #d6aa43;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #18080b,
            #551016 25%,
            #1b080d 50%,
            #67121a 75%,
            #120509
        );

    box-shadow:
        0 0 0 2px #5b3207,
        0 0 25px rgba(255, 191, 35, .25),
        0 25px 70px rgba(0,0,0,.85),
        inset 0 0 45px rgba(0,0,0,.75);

    transform-origin: center;
}


/* 금속 내부 테두리 */

.machine::before {
    content: "";

    position: absolute;

    inset: 12px;

    border:
        1px solid rgba(255,220,110,.5);

    border-radius: 18px;

    pointer-events: none;
}


/* =====================================================
   TITLE
===================================================== */

.logo-small {
    text-align: center;

    color: #dcb95c;

    font-size: 11px;

    letter-spacing: 7px;

    margin-bottom: 8px;
}

.title {
    margin: 0;

    text-align: center;

    font-size:
        clamp(40px, 7vw, 76px);

    line-height: 1;

    font-weight: 1000;

    letter-spacing:
        clamp(3px, 1vw, 9px);

    color: #fff1a6;

    text-shadow:
        0 2px 0 #7a3e00,
        0 4px 0 #351600,
        0 0 10px rgba(255,220,90,.8),
        0 0 25px rgba(255,140,20,.45);
}

.subtitle {
    margin-top: 12px;

    text-align: center;

    color: #d9b867;

    font-size: 12px;

    letter-spacing: 6px;
}


/* =====================================================
   DECORATION
===================================================== */

.ornament {
    display: flex;

    align-items: center;

    gap: 15px;

    margin:
        24px 0 22px;
}

.ornament-line {
    flex: 1;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #b88c35,
            #fff0a0,
            #b88c35,
            transparent
        );
}

.ornament-center {
    color: #f2ce65;

    font-size: 22px;
}


/* =====================================================
   SLOT FRAME
===================================================== */

.slot-frame {
    padding: 12px;

    border:
        4px solid #d3a63c;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #3a1b06,
            #b9811e,
            #3b1b05,
            #d6a936,
            #301505
        );

    box-shadow:
        0 0 18px rgba(255,190,40,.2),
        inset 0 0 20px rgba(0,0,0,.85);
}

.slot-inner {
    padding: 11px;

    border:
        3px solid #704c13;

    border-radius: 10px;

    background:
        #070608;

    box-shadow:
        inset 0 0 30px #000;
}


/* =====================================================
   SLOTS
===================================================== */

.slots {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}


/* =====================================================
   SLOT
===================================================== */

.slot {
    position: relative;

    height:
        clamp(160px, 22vw, 235px);

    overflow: hidden;

    border:
        4px solid #bd9130;

    border-radius: 9px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #eeeeee 45%,
            #c9c9c9
        );

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.5),
        inset 0 3px 0 rgba(255,255,255,.9);
}


/* 위아래 음영 */

.slot::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 28%;

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            transparent
        );
}

.slot::after {
    content: "";

    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    height: 28%;

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.55)
        );
}


/* =====================================================
   PAYLINE
===================================================== */

.payline {
    position: absolute;

    left: 0;
    right: 0;
    top: 50%;

    height: 2px;

    transform:
        translateY(-50%);

    z-index: 20;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ffe995,
            #fff,
            #ffe995,
            transparent
        );

    box-shadow:
        0 0 6px #fff,
        0 0 14px #ffc928;
}


/* =====================================================
   REEL

   핵심:
   CSS transition으로 한 번에 이동하지 않고
   JS requestAnimationFrame으로 계속 이동시킨다.

   그래서 "지지직" 없이 부드럽게 돈다.
===================================================== */

.reel {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    will-change: transform;

    transform:
        translate3d(0,0,0);
}

.symbol {
    width: 100%;

    height:
        clamp(160px, 22vw, 235px);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(70px, 10vw, 120px);

    line-height: 1;

    user-select: none;

    transform:
        translateZ(0);

    backface-visibility:
        hidden;

    /* 기존 blur 제거 */
    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,.35)
        );
}


/* 회전 중 살짝만 밝게 */

.slot.spinning {
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.5),
        0 0 15px rgba(255,205,60,.35);
}


/* =====================================================
   STOP IMPACT
===================================================== */

.reel.stop {
    animation:
        stopBounce .28s ease-out;
}

@keyframes stopBounce {

    0% {
        transform:
            scaleY(1);
    }

    35% {
        transform:
            scaleY(.985);
    }

    65% {
        transform:
            scaleY(1.01);
    }

    100% {
        transform:
            scaleY(1);
    }
}


/* =====================================================
   RESULT
===================================================== */

.result {
    min-height: 42px;

    margin-top: 17px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: #e9cc76;

    font-size:
        clamp(15px, 3vw, 23px);

    font-weight: 800;

    letter-spacing: 2px;

    text-shadow:
        0 0 10px rgba(255,180,30,.55);
}

.result.jackpot {
    color: #fff3a4;

    font-size:
        clamp(27px, 5vw, 50px);

    animation:
        jackpotGlow .6s ease-in-out infinite alternate;
}

@keyframes jackpotGlow {

    from {
        text-shadow:
            0 0 10px #fff,
            0 0 20px #ffd000;
    }

    to {
        text-shadow:
            0 0 15px #fff,
            0 0 30px #ffd000,
            0 0 50px #ff4c68;
    }
}


/* =====================================================
   GO BUTTON
===================================================== */

.button-area {
    display: flex;

    justify-content: center;

    margin-top: 19px;
}

.go-button {
    position: relative;

    width:
        clamp(180px, 30vw, 250px);

    height:
        clamp(62px, 9vw, 78px);

    border:
        4px solid #e5c45d;

    border-radius: 15px;

    background:
        linear-gradient(
            180deg,
            #fff0a0,
            #e0a929 45%,
            #8b4a08
        );

    color: #3c0908;

    font-size:
        clamp(25px, 4vw, 34px);

    font-weight: 1000;

    letter-spacing: 6px;

    cursor: pointer;

    box-shadow:
        0 7px 0 #351005,
        0 10px 25px rgba(0,0,0,.6),
        0 0 20px rgba(255,200,60,.35);

    transition:
        transform .08s,
        filter .15s;
}

.go-button:hover {
    filter:
        brightness(1.12);

    box-shadow:
        0 7px 0 #351005,
        0 10px 30px rgba(0,0,0,.7),
        0 0 35px rgba(255,210,70,.55);
}

.go-button:active {
    transform:
        translateY(6px);
}

.go-button:disabled {
    cursor:
        not-allowed;

    filter:
        brightness(.55);
}


/* =====================================================
   JACKPOT FLASH
===================================================== */

.flash {
    position: fixed;

    inset: 0;

    z-index: 50;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            circle,
            rgba(255,245,180,.75),
            transparent 60%
        );
}

.flash.active {
    animation:
        flash .9s ease-out;
}

@keyframes flash {

    0% {
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   PARTICLES
===================================================== */

#particles {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 60;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 650px) {

    .machine {
        padding:
            26px 10px 28px;

        border-width:
            4px;
    }

    .subtitle {
        letter-spacing:
            3px;
    }

    .slot-frame {
        padding:
            6px;

        border-width:
            3px;
    }

    .slot-inner {
        padding:
            6px;

        border-width:
            2px;
    }

    .slots {
        gap:
            4px;
    }

    .slot {
        border-width:
            3px;
    }
}
</style>
</head>

<body>

<div class="neon-left"></div>
<div class="neon-right"></div>

<div
    class="flash"
    id="flash">
</div>

<canvas
    id="particles">
</canvas>


<main
    class="machine"
    id="machine">

    <div class="logo-small">
        THE FOUR SACRED BEASTS
    </div>

    <h1 class="title">
        FOUR BEASTS
    </h1>

    <div class="subtitle">
        龍 · 虎 · 玄武 · 鳳凰
    </div>


    <div class="ornament">

        <div class="ornament-line"></div>

        <div class="ornament-center">
            ✦
        </div>

        <div class="ornament-line"></div>

    </div>


    <section class="slot-frame">

        <div class="slot-inner">

            <div class="slots">

                <div class="slot" id="slot0">

                    <div
                        class="reel"
                        id="reel0">
                    </div>

                    <div class="payline"></div>

                </div>


                <div class="slot" id="slot1">

                    <div
                        class="reel"
                        id="reel1">
                    </div>

                    <div class="payline"></div>

                </div>


                <div class="slot" id="slot2">

                    <div
                        class="reel"
                        id="reel2">
                    </div>

                    <div class="payline"></div>

                </div>


                <div class="slot" id="slot3">

                    <div
                        class="reel"
                        id="reel3">
                    </div>

                    <div class="payline"></div>

                </div>

            </div>

        </div>

    </section>


    <div
        class="result"
        id="result">

        운명을 시험해보세요

    </div>


    <div class="button-area">

        <button
            class="go-button"
            id="go">

            GO

        </button>

    </div>

</main>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const SYMBOLS = [
    "🐉",
    "🐯",
    "🐢",
    "🔥"
];

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];

const slots = [
    document.getElementById("slot0"),
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];

const button =
    document.getElementById("go");

const result =
    document.getElementById("result");

const machine =
    document.getElementById("machine");

const flash =
    document.getElementById("flash");

let spinning = false;


/* =====================================================
   RANDOM
===================================================== */

function randomSymbol() {

    return SYMBOLS[
        Math.floor(
            Math.random() *
            SYMBOLS.length
        )
    ];
}


/* =====================================================
   REEL SETUP
===================================================== */

function buildReel(
    reel,
    finalSymbol
) {

    reel.innerHTML = "";

    /*
        많은 심볼을 연결해서
        실제 릴처럼 계속 이어진다.
    */

    const count = 80;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const div =
            document.createElement("div");

        div.className =
            "symbol";

        div.textContent =
            i === count - 1
                ? finalSymbol
                : randomSymbol();

        reel.appendChild(div);
    }

    return count - 1;
}


/* =====================================================
   WAIT
===================================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =====================================================
   SMOOTH REEL ANIMATION
===================================================== */

function spinReel(
    index,
    finalSymbol,
    duration
) {

    return new Promise(resolve => {

        const reel =
            reels[index];

        const slot =
            slots[index];


        const finalIndex =
            buildReel(
                reel,
                finalSymbol
            );


        const symbol =
            reel.querySelector(
                ".symbol"
            );


        const height =
            symbol.getBoundingClientRect()
                .height;


        /*
            시작 위치
        */

        let position = 0;

        let lastTime = null;

        const startTime =
            performance.now();


        /*
            최종 위치

            몇 바퀴 충분히 돈 뒤
            마지막 심볼에 도착
        */

        const target =
            -(
                (finalIndex - 1) *
                height
            );


        /*
            실제 회전 속도

            처음에는 빠르게
            마지막에는 자연스럽게 감속
        */

        const totalDistance =
            Math.abs(target);


        /*
            슬롯 활성화
        */

        slot.classList.add(
            "spinning"
        );


        /*
            부드러운 애니메이션
        */

        function animate(time) {

            if (!lastTime) {
                lastTime = time;
            }


            const elapsed =
                time -
                startTime;


            const progress =
                Math.min(
                    elapsed / duration,
                    1
                );


            /*
                cubic easing

                처음 빠르게
                마지막 부드럽게 정지
            */

            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    4
                );


            position =
                target *
                eased;


            reel.style.transform =
                `translate3d(
                    0,
                    ${position}px,
                    0
                )`;


            if (
                progress < 1
            ) {

                lastTime =
                    time;

                requestAnimationFrame(
                    animate
                );

            } else {

                /*
                    정확한 최종 위치
                */

                reel.style.transform =
                    `translate3d(
                        0,
                        ${target}px,
                        0
                    )`;


                slot.classList.remove(
                    "spinning"
                );


                reel.classList.add(
                    "stop"
                );


                setTimeout(() => {

                    reel.classList.remove(
                        "stop"
                    );

                }, 300);


                playStopSound();

                resolve();
            }
        }


        requestAnimationFrame(
            animate
        );

    });
}


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let rollingTimer = null;

let rollingGain = null;


function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


/* =====================================================
   CASINO ROLL SOUND
===================================================== */

/*
    기존의 지지직 소리를 제거하고

    짧은 고음/저음을 빠르게 반복해서
    "도르르르르..." 느낌을 만든다.
*/

function startRollSound() {

    stopRollSound();

    const ctx =
        getAudio();


    rollingGain =
        ctx.createGain();


    rollingGain.gain.value =
        0.025;


    rollingGain.connect(
        ctx.destination
    );


    rollingTimer =
        setInterval(() => {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            osc.type =
                "sine";


            const frequency =
                170 +
                Math.random() *
                100;


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0.001,
                ctx.currentTime
            );


            gain.gain.exponentialRampToValueAtTime(
                0.045,
                ctx.currentTime + .008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                ctx.currentTime + .065
            );


            osc.connect(gain);

            gain.connect(
                rollingGain
            );


            osc.start();

            osc.stop(
                ctx.currentTime + .07
            );

        }, 72);
}


/* =====================================================
   STOP ROLL SOUND
===================================================== */

function stopRollSound() {

    if (rollingTimer) {

        clearInterval(
            rollingTimer
        );

        rollingTimer =
            null;
    }


    if (rollingGain) {

        try {

            rollingGain.gain
                .exponentialRampToValueAtTime(
                    0.001,
                    getAudio().currentTime + .08
                );

        } catch(e) {}

        rollingGain =
            null;
    }
}


/* =====================================================
   STOP SOUND
===================================================== */

function playStopSound() {

    const ctx =
        getAudio();


    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        "triangle";


    osc.frequency.setValueAtTime(
        230,
        ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        120,
        ctx.currentTime + .09
    );


    gain.gain.setValueAtTime(
        .07,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .12
    );


    osc.connect(gain);

    gain.connect(
        ctx.destination
    );


    osc.start();

    osc.stop(
        ctx.currentTime + .13
    );
}


/* =====================================================
   JACKPOT SOUND
===================================================== */

function jackpotSound() {

    const ctx =
        getAudio();


    const notes = [
        523.25,
        659.25,
        783.99,
        1046.50,
        1318.51
    ];


    notes.forEach(
        (note, index) => {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            osc.type =
                "triangle";


            const start =
                ctx.currentTime +
                index * .11;


            osc.frequency.value =
                note;


            gain.gain.setValueAtTime(
                .001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .12,
                start + .02
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                start + .4
            );


            osc.connect(gain);

            gain.connect(
                ctx.destination
            );


            osc.start(start);

            osc.stop(
                start + .45
            );

        }
    );
}


/* =====================================================
   PARTICLES
===================================================== */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");

let particles = [];


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   JACKPOT PARTICLES
===================================================== */

function createJackpotParticles() {

    const rect =
        machine.getBoundingClientRect();


    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            Math.random() *
            10 +
            4;


        particles.push({

            x:
                rect.left +
                rect.width / 2,

            y:
                rect.top +
                rect.height / 2,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                1,

            size:
                Math.random() *
                4 +
                2
        });
    }
}


/* =====================================================
   PARTICLE LOOP
===================================================== */

function particleLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );


    particles.forEach(
        particle => {

            particle.x +=
                particle.vx;

            particle.y +=
                particle.vy;

            particle.vy +=
                .22;

            particle.life -=
                .018;


            ctx.globalAlpha =
                particle.life;

            ctx.fillStyle =
                Math.random() > .5
                    ? "#ffd84a"
                    : "#fff1a0";


            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    ctx.globalAlpha =
        1;


    requestAnimationFrame(
        particleLoop
    );
}

particleLoop();


/* =====================================================
   JACKPOT EFFECT
===================================================== */

function jackpotEffect() {

    result.classList.add(
        "jackpot"
    );


    flash.classList.remove(
        "active"
    );


    void flash.offsetWidth;


    flash.classList.add(
        "active"
    );


    createJackpotParticles();

    jackpotSound();


    machine.animate(
        [
            {
                transform:
                    "translateX(0)"
            },
            {
                transform:
                    "translateX(-4px)"
            },
            {
                transform:
                    "translateX(4px)"
            },
            {
                transform:
                    "translateX(-3px)"
            },
            {
                transform:
                    "translateX(0)"
            }
        ],
        {
            duration:
                700,

            easing:
                "ease-out"
        }
    );
}


/* =====================================================
   GAME
===================================================== */

async function startGame() {

    if (spinning) {
        return;
    }


    spinning =
        true;


    button.disabled =
        true;


    result.classList.remove(
        "jackpot"
    );


    result.textContent =
        "GOOD LUCK";


    /*
        브라우저 오디오 활성화
    */

    const ctx =
        getAudio();


    if (
        ctx.state ===
        "suspended"
    ) {

        await ctx.resume();

    }


    /*
        결과를 먼저 결정
    */

    const results = [

        randomSymbol(),
        randomSymbol(),
        randomSymbol(),
        randomSymbol()

    ];


    /*
        도르르르 소리 시작
    */

    startRollSound();


    /*
        1번
    */

    await spinReel(
        0,
        results[0],
        2100
    );


    await wait(220);


    /*
        2번
    */

    await spinReel(
        1,
        results[1],
        2350
    );


    await wait(220);


    /*
        3번
    */

    await spinReel(
        2,
        results[2],
        2600
    );


    await wait(220);


    /*
        4번
    */

    await spinReel(
        3,
        results[3],
        2850
    );


    stopRollSound();


    /*
        당첨 판정
    */

    const jackpot =
        results.every(
            symbol =>
                symbol ===
                results[0]
        );


    await wait(250);


    if (jackpot) {

        result.textContent =
            "🎉 JACKPOT! 🎉";

        jackpotEffect();

    } else {

        result.textContent =
            results.join("   ") +
            "  —  다시 도전!";

    }


    spinning =
        false;


    button.disabled =
        false;
}


/* =====================================================
   INITIAL DISPLAY
===================================================== */

function initialize() {

    const initial = [
        "🐉",
        "🐯",
        "🐢",
        "🔥"
    ];


    reels.forEach(
        (reel, index) => {

            const finalIndex =
                buildReel(
                    reel,
                    initial[index]
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            /*
                마지막에서 한 칸 위에 위치시켜
                중앙에 심볼이 보이게 함
            */

            reel.style.transform =
                `translate3d(
                    0,
                    ${-(finalIndex - 1) * height}px,
                    0
                )`;
        }
    );
}


button.addEventListener(
    "click",
    startGame
);


initialize();

</script>
