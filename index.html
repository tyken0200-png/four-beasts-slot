<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FOUR BEASTS — JACKPOT</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background:
        radial-gradient(
            ellipse at center,
            #68151d 0%,
            #35080e 32%,
            #120307 68%,
            #020102 100%
        );

    color:#fff;
}

/* 배경 광원 */
body::before{
    content:"";
    position:fixed;
    inset:-20%;

    background:
        radial-gradient(
            circle at 18% 30%,
            rgba(255,30,40,.28),
            transparent 22%
        ),
        radial-gradient(
            circle at 82% 28%,
            rgba(255,210,30,.25),
            transparent 22%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,80,0,.16),
            transparent 38%
        );

    pointer-events:none;
}

/* ==================================================
   MACHINE
================================================== */

.machine{
    position:relative;
    width:min(1120px,96vw);

    padding:
        28px
        clamp(12px,4vw,48px)
        32px;

    border-radius:30px;

    border:5px solid #d4a52f;

    background:
        linear-gradient(
            145deg,
            #210509,
            #72151e 18%,
            #30070d 42%,
            #861722 68%,
            #180307
        );

    box-shadow:
        0 0 0 2px #5d3507,
        0 0 25px rgba(255,195,45,.3),
        0 0 100px rgba(255,30,40,.2),
        0 30px 100px rgba(0,0,0,.9),
        inset 0 0 55px rgba(0,0,0,.85);

    z-index:5;
}

.machine::before{
    content:"";
    position:absolute;
    inset:9px;

    border:1px solid rgba(255,229,135,.6);
    border-radius:20px;

    pointer-events:none;
}

/* ==================================================
   LED LIGHTS
================================================== */

.lights{
    position:absolute;
    left:18px;
    right:18px;
    top:14px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.light{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#ffe88a;

    box-shadow:
        0 0 5px #fff,
        0 0 13px #ffc928,
        0 0 25px #ff8700;

    animation:
        led .65s infinite alternate;
}

.light:nth-child(2n){
    animation-delay:.12s;
}

.light:nth-child(3n){
    animation-delay:.25s;
}

.light:nth-child(4n){
    animation-delay:.38s;
}

@keyframes led{
    from{
        opacity:.3;
        transform:scale(.65);
    }

    to{
        opacity:1;
        transform:scale(1.3);
    }
}

/* ==================================================
   HEADER
================================================== */

.brand{
    text-align:center;
    margin-top:5px;

    color:#dfba59;

    font-size:9px;
    letter-spacing:7px;
}

.title{
    margin:
        7px 0 0;

    text-align:center;

    font-size:
        clamp(42px,7vw,80px);

    font-weight:1000;

    letter-spacing:
        clamp(3px,1vw,9px);

    line-height:.9;

    color:#fff2a4;

    text-shadow:
        0 3px 0 #8c4500,
        0 6px 0 #381300,
        0 0 10px #fff,
        0 0 24px #ffc400,
        0 0 48px rgba(255,70,0,.5);
}

.subtitle{
    text-align:center;

    margin-top:13px;

    color:#e2bd61;

    font-size:10px;

    letter-spacing:5px;
}

/* ==================================================
   CASINO HUD
================================================== */

.casino-hud{
    display:flex;
    justify-content:center;
    gap:10px;

    margin:
        18px auto 12px;

    flex-wrap:wrap;
}

.hud-box{
    min-width:130px;

    padding:
        7px 15px;

    border:
        1px solid #a77720;

    background:
        linear-gradient(
            #170407,
            #050204
        );

    box-shadow:
        inset 0 0 10px #000,
        0 0 8px rgba(255,180,30,.15);

    text-align:center;
}

.hud-label{
    display:block;

    color:#b9933f;

    font-size:8px;

    letter-spacing:3px;
}

.hud-value{
    display:block;

    margin-top:2px;

    color:#fff0a0;

    font-family:
        "Courier New",
        monospace;

    font-size:17px;

    font-weight:900;

    text-shadow:
        0 0 8px #ffc400;
}

/* ==================================================
   ORNAMENT
================================================== */

.ornament{
    display:flex;
    align-items:center;
    gap:15px;

    margin:16px 0;
}

.line{
    flex:1;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #8b611c,
            #ffe88b,
            #8b611c,
            transparent
        );
}

.diamond{
    color:#ffd45b;
    font-size:19px;

    text-shadow:
        0 0 12px #ffb300;
}

/* ==================================================
   SLOT FRAME
================================================== */

.slot-frame{
    padding:12px;

    border:5px solid #d3a02d;
    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #371904,
            #e1b33c,
            #553009,
            #f2ce58,
            #3a1a04
        );

    box-shadow:
        inset 0 0 25px #160702,
        0 0 28px rgba(255,190,40,.3);
}

.slot-inner{
    padding:9px;

    border:
        3px solid #704b12;

    border-radius:9px;

    background:#030203;

    box-shadow:
        inset 0 0 35px #000;
}

/* ==================================================
   SLOTS
================================================== */

.slots{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.slot{
    position:relative;

    height:
        clamp(150px,21vw,235px);

    overflow:hidden;

    border:
        4px solid #b98925;

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #e8e8e8 45%,
            #bdbdbd
        );

    box-shadow:
        inset 0 0 28px rgba(0,0,0,.7);
}

.slot.spinning{
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.7),
        0 0 22px rgba(255,205,50,.75);
}

.reel{
    position:absolute;

    left:0;
    top:0;

    width:100%;

    will-change:transform;

    transform:
        translate3d(0,0,0);

    backface-visibility:hidden;
}

.symbol{
    width:100%;

    height:
        clamp(150px,21vw,235px);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:
        clamp(70px,10vw,120px);

    user-select:none;

    filter:
        drop-shadow(
            0 6px 5px rgba(0,0,0,.45)
        );
}

/* 유리 반사 */
.slot::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:20;

    pointer-events:none;

    background:
        linear-gradient(
            105deg,
            rgba(255,255,255,.25),
            transparent 20%,
            transparent 72%,
            rgba(255,255,255,.1)
        );
}

/* 그림자 */
.slot::after{
    content:"";

    position:absolute;

    inset:0;

    z-index:21;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.32),
            transparent 18%,
            transparent 82%,
            rgba(0,0,0,.28)
        );
}

/* ==================================================
   PAYLINE
================================================== */

.payline{
    position:absolute;

    left:0;
    right:0;
    top:50%;

    height:3px;

    transform:
        translateY(-50%);

    z-index:30;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            #ffe56c,
            white,
            transparent
        );

    box-shadow:
        0 0 8px white,
        0 0 17px #ffc400;

    pointer-events:none;
}

/* ==================================================
   RESULT
================================================== */

.result{
    min-height:52px;

    margin-top:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#e7c86f;

    font-size:
        clamp(15px,3vw,22px);

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 0 13px rgba(255,180,30,.65);
}

.result.jackpot{
    color:#fff;

    font-size:
        clamp(30px,6vw,65px);

    animation:
        jackpotResult .45s infinite alternate;
}

@keyframes jackpotResult{
    from{
        transform:scale(1);
        text-shadow:
            0 0 8px white,
            0 0 20px #ffd900;
    }

    to{
        transform:scale(1.12);
        text-shadow:
            0 0 10px white,
            0 0 30px #ffe600,
            0 0 60px #ff7200;
    }
}

/* ==================================================
   GO BUTTON
================================================== */

.button-wrap{
    display:flex;
    justify-content:center;

    margin-top:9px;
}

.go{
    width:
        clamp(200px,34vw,285px);

    height:
        clamp(62px,9vw,80px);

    border:
        4px solid #f1cf67;

    border-radius:14px;

    cursor:pointer;

    background:
        linear-gradient(
            180deg,
            #fff3aa,
            #e5af30 42%,
            #9a4b08
        );

    color:#3a0805;

    font-size:
        clamp(25px,4vw,37px);

    font-weight:1000;

    letter-spacing:8px;

    box-shadow:
        0 7px 0 #350b04,
        0 12px 30px rgba(0,0,0,.75),
        0 0 30px rgba(255,200,40,.45);

    transition:
        .08s;
}

.go:hover{
    filter:brightness(1.16);

    box-shadow:
        0 7px 0 #350b04,
        0 14px 35px rgba(0,0,0,.8),
        0 0 45px rgba(255,215,60,.7);
}

.go:active{
    transform:translateY(6px);
}

.go:disabled{
    cursor:not-allowed;
    filter:brightness(.55);
}

/* ==================================================
   JACKPOT OVERLAY
================================================== */

.jackpot-overlay{
    position:fixed;
    inset:0;

    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(255,230,100,.5),
            rgba(255,20,40,.16) 40%,
            transparent 75%
        );
}

.jackpot-overlay.show{
    animation:
        jackpotOverlay 3s ease-out;
}

@keyframes jackpotOverlay{
    0%{
        opacity:0;
        transform:scale(.5);
    }

    10%{
        opacity:1;
        transform:scale(1.08);
    }

    30%{
        opacity:.8;
    }

    100%{
        opacity:0;
        transform:scale(1.35);
    }
}

.big-jackpot{
    text-align:center;

    opacity:0;

    transform:
        scale(.2)
        rotate(-7deg);
}

.jackpot-overlay.show .big-jackpot{
    animation:
        jackpotPop 3s cubic-bezier(.1,.8,.2,1);
}

.big-jackpot .small{
    display:block;

    color:#fff4a5;

    font-size:
        clamp(18px,4vw,35px);

    letter-spacing:8px;

    font-weight:1000;
}

.big-jackpot .main{
    display:block;

    margin-top:5px;

    color:#fff;

    font-size:
        clamp(55px,12vw,155px);

    line-height:.85;

    font-weight:1000;

    font-style:italic;

    letter-spacing:-5px;

    text-shadow:
        0 5px 0 #8d4300,
        0 10px 0 #4b1600,
        0 0 10px white,
        0 0 30px #ffe000,
        0 0 65px #ff8c00,
        0 0 110px #ff174d;
}

@keyframes jackpotPop{
    0%{
        opacity:0;
        transform:
            scale(.1)
            rotate(-12deg);
    }

    10%{
        opacity:1;
        transform:
            scale(1.3)
            rotate(3deg);
    }

    18%{
        transform:
            scale(.9)
            rotate(-2deg);
    }

    28%{
        transform:
            scale(1.08)
            rotate(1deg);
    }

    40%{
        transform:
            scale(1)
            rotate(0);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(1.2);
    }
}

/* ==================================================
   FLASH
================================================== */

.flash{
    position:fixed;
    inset:0;

    z-index:150;

    pointer-events:none;

    opacity:0;
}

.flash.show{
    animation:
        screenFlash .45s ease-out;
}

@keyframes screenFlash{
    0%{
        opacity:0;
        background:#fff;
    }

    15%{
        opacity:.9;
    }

    100%{
        opacity:0;
    }
}

/* ==================================================
   PARTICLES
================================================== */

#particles{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:180;

    pointer-events:none;
}

/* ==================================================
   MOBILE
================================================== */

@media(max-width:650px){

    .machine{
        padding:
            25px 8px 24px;

        border-width:4px;
    }

    .brand{
        letter-spacing:4px;
    }

    .subtitle{
        letter-spacing:2px;
    }

    .casino-hud{
        gap:5px;
    }

    .hud-box{
        min-width:100px;
        padding:5px 9px;
    }

    .slot-frame{
        padding:6px;
        border-width:3px;
    }

    .slot-inner{
        padding:5px;
        border-width:2px;
    }

    .slots{
        gap:4px;
    }

    .slot{
        border-width:3px;
    }

    .lights{
        left:12px;
        right:12px;
    }

    .light{
        width:5px;
        height:5px;
    }
}
</style>
</head>

<main class="machine" id="machine">

        <div class="light"></div>

        <div class="light"></div>

        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>

<script>

/* ================================================
   SYMBOLS
================================================ */

const SYMBOLS = [
    "🐉",
    "🐯",
    "🐢",
    "🔥"
];


/* ================================================
   DOM
================================================ */

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];

const slots = [
    document.getElementById("slot0"),
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];

const button =
    document.getElementById("go");

const result =
    document.getElementById("result");

const machine =
    document.getElementById("machine");

const overlay =
    document.getElementById("jackpotOverlay");

const flash =
    document.getElementById("flash");

const bonus =
    document.getElementById("bonus");

const win =
    document.getElementById("win");

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");


let spinning = false;

let audio = null;

let rollTimer = null;

let rollGain = null;

let particles = [];


/* ================================================
   AUDIO CONTEXT
================================================ */

function getAudio(){

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audio;
}


/* ================================================
   LOUD ROLLING SOUND
================================================ */

function startRollSound(){

    stopRollSound();

    const ac =
        getAudio();

    rollGain =
        ac.createGain();


    /*
       여기 숫자가 회전음 볼륨.

       기존 .08보다 크게
       .20으로 설정.
    */

    rollGain.gain.setValueAtTime(
        .001,
        ac.currentTime
    );

    rollGain.gain.exponentialRampToValueAtTime(
        .20,
        ac.currentTime + .12
    );

    rollGain.connect(
        ac.destination
    );


    /*
       빠른 금속 릴 소리.

       아주 짧은 소리를 계속 이어서
       "도르르르르르르르르"
       느낌을 만든다.
    */

    rollTimer =
        setInterval(() => {

            if(!rollGain)
                return;

            const osc =
                ac.createOscillator();

            const gain =
                ac.createGain();


            osc.type =
                "square";


            osc.frequency.value =
                155 +
                Math.random()*100;


            gain.gain.setValueAtTime(
                .0001,
                ac.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .075,
                ac.currentTime + .003
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                ac.currentTime + .04
            );


            osc.connect(gain);
            gain.connect(rollGain);


            osc.start();

            osc.stop(
                ac.currentTime + .045
            );

        },30);
}


/* ================================================
   STOP ROLL SOUND
================================================ */

function stopRollSound(){

    if(rollTimer){

        clearInterval(
            rollTimer
        );

        rollTimer = null;
    }


    if(rollGain){

        const ac =
            getAudio();

        try{

            rollGain.gain.cancelScheduledValues(
                ac.currentTime
            );

            rollGain.gain.exponentialRampToValueAtTime(
                .0001,
                ac.currentTime + .12
            );

        }catch(e){}


        setTimeout(() => {

            try{
                rollGain.disconnect();
            }catch(e){}

            rollGain = null;

        },160);
    }
}


/* ================================================
   METAL TING
================================================ */

function metalTing(){

    const ac =
        getAudio();

    /*
       맑은 금속성 "팅!"
    */

    const frequencies = [
        880,
        1760,
        2640
    ];


    frequencies.forEach(
        (freq,index) => {

            const osc =
                ac.createOscillator();

            const gain =
                ac.createGain();


            osc.type =
                "sine";


            osc.frequency.value =
                freq;


            const start =
                ac.currentTime +
                index*.006;


            gain.gain.setValueAtTime(
                .001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                index === 0 ? .20 : .08,
                start + .008
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                start + .55
            );


            osc.connect(gain);

            gain.connect(
                ac.destination
            );


            osc.start(start);

            osc.stop(
                start+.58
            );

        }
    );
}


/* ================================================
   JACKPOT SOUND
================================================ */

function jackpotSound(){

    const ac =
        getAudio();


    const notes = [
        392,
        494,
        587,
        659,
        784,
        988,
        1175,
        1319
    ];


    notes.forEach(
        (freq,index) => {

            const osc =
                ac.createOscillator();

            const gain =
                ac.createGain();


            const start =
                ac.currentTime +
                index*.10;


            osc.type =
                "sawtooth";

            osc.frequency.value =
                freq;


            gain.gain.setValueAtTime(
                .001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                .15,
                start+.025
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                start+.38
            );


            osc.connect(gain);
            gain.connect(ac.destination);


            osc.start(start);

            osc.stop(
                start+.4
            );

        }
    );


    setTimeout(() => {

        /*
           마지막 화려한 화음
        */

        [523,659,784,1047,1319].forEach(
            freq => {

                const osc =
                    ac.createOscillator();

                const gain =
                    ac.createGain();


                osc.type =
                    "triangle";

                osc.frequency.value =
                    freq;


                gain.gain.setValueAtTime(
                    .001,
                    ac.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    .16,
                    ac.currentTime+.03
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    ac.currentTime+.9
                );


                osc.connect(gain);
                gain.connect(ac.destination);


                osc.start();

                osc.stop(
                    ac.currentTime+1
                );

            }
        );

    },850);
}


/* ================================================
   WAIT
================================================ */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


/* ================================================
   RANDOM SYMBOL
================================================ */

function randomSymbol(){

    return SYMBOLS[
        Math.floor(
            Math.random() *
            SYMBOLS.length
        )
    ];
}


/* ================================================
   BUILD REEL
================================================ */

function buildReel(
    reel,
    finalSymbol
){

    reel.innerHTML = "";

    const total = 110;


    for(
        let i=0;
        i<total;
        i++
    ){

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "symbol";


        div.textContent =
            i === total-1
                ? finalSymbol
                : randomSymbol();


        reel.appendChild(div);
    }


    return total-1;
}


/* ================================================
   SPIN
================================================ */

function spinReel(
    index,
    finalSymbol,
    duration
){

    return new Promise(
        resolve => {

            const reel =
                reels[index];

            const slot =
                slots[index];


            const finalIndex =
                buildReel(
                    reel,
                    finalSymbol
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            const target =
                -(
                    (finalIndex-1) *
                    height
                );


            const start =
                performance.now();


            slot.classList.add(
                "spinning"
            );


            function animate(time){

                const elapsed =
                    time-start;


                const progress =
                    Math.min(
                        elapsed/duration,
                        1
                    );


                /*
                   초반 빠름
                   후반 강한 감속
                */

                const eased =
                    1 -
                    Math.pow(
                        1-progress,
                        4.5
                    );


                const position =
                    target*eased;


                reel.style.transform =
                    `translate3d(
                        0,
                        ${position}px,
                        0
                    )`;


                if(progress<1){

                    requestAnimationFrame(
                        animate
                    );

                }else{

                    reel.style.transform =
                        `translate3d(
                            0,
                            ${target}px,
                            0
                        )`;


                    slot.classList.remove(
                        "spinning"
                    );


                    /*
                       여기서 "팅!"
                    */

                    metalTing();


                    /*
                       살짝 걸리는 느낌
                    */

                    reel.animate(
                        [
                            {
                                transform:
                                    `translate3d(
                                        0,
                                        ${target}px,
                                        0
                                    )`
                            },

                            {
                                transform:
                                    `translate3d(
                                        0,
                                        ${target+5}px,
                                        0
                                    )`
                            },

                            {
                                transform:
                                    `translate3d(
                                        0,
                                        ${target}px,
                                        0
                                    )`
                            }
                        ],
                        {
                            duration:180,
                            easing:"ease-out"
                        }
                    );


                    resolve();
                }
            }


            requestAnimationFrame(
                animate
            );
        }
    );
}

/* ================================================
   COINS
================================================ */

function createCoins(){

    const rect =
        machine.getBoundingClientRect();


    for(
        let i=0;
        i<300;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI*2;


        const speed =
            Math.random()*15+5;


        particles.push({

            x:
                rect.left+
                rect.width/2,

            y:
                rect.top+
                rect.height/2,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            size:
                Math.random()*7+3,

            life:1,

            rotation:
                Math.random()*Math.PI,

            spin:
                Math.random()*.3+.08

        });
    }
}


/* ================================================
   PARTICLES
================================================ */

function particlesLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles =
        particles.filter(
            p =>
                p.life>0
        );


    particles.forEach(
        p => {

            p.x += p.vx;

            p.y += p.vy;

            p.vy += .23;

            p.rotation +=
                p.spin;

            p.life -= .012;


            ctx.save();

            ctx.globalAlpha =
                p.life;

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(
                p.rotation
            );


            ctx.fillStyle =
                "#ffd84a";

            ctx.fillRect(
                -p.size,
                -p.size*.55,
                p.size*2,
                p.size*1.1
            );


            ctx.strokeStyle =
                "#fff4a3";

            ctx.lineWidth=1;

            ctx.strokeRect(
                -p.size,
                -p.size*.55,
                p.size*2,
                p.size*1.1
            );


            ctx.restore();

        }
    );


    requestAnimationFrame(
        particlesLoop
    );
}

particlesLoop();

/* ================================================
   GAME
================================================ */

async function startGame(){

    if(spinning)
        return;


    spinning=true;

    button.disabled=true;


    result.classList.remove(
        "jackpot"
    );


    result.textContent =
        "GOOD LUCK...";


    win.textContent =
        "000,000";


    bonus.textContent =
        "x08";


    const ac =
        getAudio();


    if(ac.state==="suspended")
        await ac.resume();


    /*
       결과 생성

       실제 돈을 거는 기능은 없고
       단순 게임 연출용 결과.
    */

    const results = [
        randomSymbol(),
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];


    /*
       회전음 시작
    */

    startRollSound();


    /*
       릴 1
    */

    await spinReel(
        0,
        results[0],
        1150
    );


    await wait(90);


    /*
       릴 2
    */

    await spinReel(
        1,
        results[1],
        1300
    );


    await wait(90);


    /*
       릴 3
    */

    await spinReel(
        2,
        results[2],
        1450
    );


    await wait(90);


    /*
       마지막 릴
       조금 오래 끌기
    */

    await spinReel(
        3,
        results[3],
        1650
    );


    stopRollSound();


    await wait(300);


    /*
       4개 동일
    */

    const jackpot =
        results.every(
            value =>
                value===results[0]
        );


    if(jackpot){

        jackpotEffect();

    }else{

        result.textContent =
            "★ BETTER LUCK NEXT TIME ★";

    }


    spinning=false;

    button.disabled=false;
}


/* ================================================
   INITIALIZE
================================================ */

function initialize(){

    const initial = [
        "🐉",
        "🐯",
        "🐢",
        "🔥"
    ];


    reels.forEach(
        (reel,index) => {

            const finalIndex =
                buildReel(
                    reel,
                    initial[index]
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            reel.style.transform =
                `translate3d(
                    0,
                    ${-(finalIndex-1)*height}px,
                    0
                )`;
        }
    );
}

button.addEventListener(

);


initialize();
