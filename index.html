<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOUR BEASTS JACKPOT</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 50% 45%,
            #64151d 0%,
            #300910 35%,
            #10050a 68%,
            #030204 100%
        );
}

/* =====================================================
   CASINO BACKGROUND
===================================================== */

body:before{
    content:"";
    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,190,40,.035) 0deg 8deg,
            transparent 8deg 16deg
        );

    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 72%
        );
}

body:after{
    content:"";
    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,0,70,.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(255,210,30,.17),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,30,60,.14),
            transparent 45%
        );
}

/* =====================================================
   MACHINE
===================================================== */

.machine{
    position:relative;

    width:min(1100px,95vw);

    padding:
        30px
        clamp(12px,4vw,48px)
        34px;

    border-radius:30px;

    border:
        5px solid #d7a832;

    background:
        linear-gradient(
            145deg,
            #180509,
            #5b1019 20%,
            #20070c 42%,
            #74131b 67%,
            #170407
        );

    box-shadow:
        0 0 0 2px #5c3207,
        0 0 20px rgba(255,200,60,.25),
        0 0 80px rgba(255,30,50,.16),
        0 30px 80px rgba(0,0,0,.9),
        inset 0 0 45px rgba(0,0,0,.8);

    z-index:5;
}

.machine:before{
    content:"";

    position:absolute;
    inset:10px;

    border:
        1px solid rgba(255,230,130,.55);

    border-radius:20px;

    pointer-events:none;
}


/* =====================================================
   LIGHTS
===================================================== */

.lights{
    position:absolute;

    left:18px;
    right:18px;
    top:15px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.light{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffe875;

    box-shadow:
        0 0 5px #fff,
        0 0 12px #ffc928,
        0 0 22px #ff9d00;

    animation:
        lightBlink .7s infinite alternate;
}

.light:nth-child(2n){
    animation-delay:.15s;
}

.light:nth-child(3n){
    animation-delay:.3s;
}

@keyframes lightBlink{
    from{
        opacity:.35;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.25);
    }
}


/* =====================================================
   TITLE
===================================================== */

.brand{
    text-align:center;

    margin-top:4px;

    color:#e4c36c;

    font-size:10px;

    letter-spacing:7px;
}

.title{
    margin:7px 0 0;

    text-align:center;

    font-size:
        clamp(42px,7vw,78px);

    font-weight:1000;

    letter-spacing:
        clamp(3px,1vw,9px);

    line-height:.95;

    color:#fff3a7;

    text-shadow:
        0 2px 0 #8a4700,
        0 5px 0 #351400,
        0 0 10px #fff3a7,
        0 0 25px #ffb300,
        0 0 45px rgba(255,80,0,.45);
}

.subtitle{
    margin-top:13px;

    text-align:center;

    color:#dfbd64;

    font-size:11px;

    letter-spacing:5px;
}


/* =====================================================
   JACKPOT DISPLAY
===================================================== */

.jackpot-board{
    margin:
        22px auto 15px;

    width:min(650px,90%);

    padding:9px 18px;

    border:
        2px solid #d2a437;

    border-radius:7px;

    background:
        linear-gradient(
            #170609,
            #060304
        );

    box-shadow:
        inset 0 0 15px #000,
        0 0 15px rgba(255,180,30,.15);
}

.jackpot-label{
    text-align:center;

    color:#dcb452;

    font-size:9px;

    letter-spacing:5px;

    margin-bottom:3px;
}

.jackpot-value{
    text-align:center;

    color:#fff1a0;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(20px,4vw,34px);

    font-weight:900;

    letter-spacing:6px;

    text-shadow:
        0 0 7px #fff,
        0 0 16px #ffc400;
}


/* =====================================================
   ORNAMENT
===================================================== */

.ornament{
    display:flex;
    align-items:center;
    gap:15px;

    margin:18px 0;
}

.line{
    flex:1;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #8b611a,
            #ffe794,
            #8b611a,
            transparent
        );
}

.diamond{
    color:#ffd45b;

    font-size:20px;

    text-shadow:
        0 0 10px #ffbd22;
}


/* =====================================================
   SLOT FRAME
===================================================== */

.slot-frame{
    padding:12px;

    border:
        5px solid #d4a431;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #351805,
            #d19b29,
            #54300b,
            #f0c94d,
            #3a1a04
        );

    box-shadow:
        inset 0 0 20px #160702,
        0 0 25px rgba(255,190,40,.25);
}

.slot-inner{
    padding:10px;

    border:
        3px solid #704b12;

    border-radius:9px;

    background:#050305;

    box-shadow:
        inset 0 0 30px #000;
}


/* =====================================================
   SLOTS
===================================================== */

.slots{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.slot{
    position:relative;

    height:
        clamp(150px,21vw,235px);

    overflow:hidden;

    border:
        4px solid #b98825;

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #e8e8e8 45%,
            #c0c0c0
        );

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.65);
}

.slot.spinning{
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.6),
        0 0 18px rgba(255,200,40,.5);
}


/* =====================================================
   PAYLINE
===================================================== */

.payline{
    position:absolute;

    top:50%;
    left:0;
    right:0;

    height:3px;

    transform:
        translateY(-50%);

    z-index:30;

    background:
        linear-gradient(
            90deg,
            transparent,
            #fff,
            #ffe271,
            #fff,
            transparent
        );

    box-shadow:
        0 0 7px white,
        0 0 16px #ffc400;

    pointer-events:none;
}


/* =====================================================
   REEL
===================================================== */

.reel{
    position:absolute;

    left:0;
    top:0;

    width:100%;

    will-change:
        transform;

    transform:
        translate3d(0,0,0);

    backface-visibility:hidden;
}

.symbol{
    width:100%;

    height:
        clamp(150px,21vw,235px);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:
        clamp(68px,10vw,120px);

    line-height:1;

    user-select:none;

    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,.4)
        );
}


/* =====================================================
   REEL GLASS
===================================================== */

.slot:before{
    content:"";

    position:absolute;
    inset:0;

    z-index:20;

    pointer-events:none;

    background:
        linear-gradient(
            105deg,
            rgba(255,255,255,.22),
            transparent 20%,
            transparent 75%,
            rgba(255,255,255,.08)
        );
}

.slot:after{
    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:0;

    width:17%;

    z-index:25;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.4),
            transparent
        );
}


/* =====================================================
   RESULT
===================================================== */

.result{
    min-height:48px;

    margin-top:14px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:#e5c66d;

    font-size:
        clamp(15px,3vw,22px);

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 0 12px rgba(255,180,30,.6);
}

.result.jackpot{
    position:relative;

    color:#fff;

    font-size:
        clamp(30px,6vw,64px);

    font-weight:1000;

    letter-spacing:4px;

    animation:
        jackpotText .65s ease-out infinite alternate;

    z-index:100;
}

@keyframes jackpotText{
    from{
        transform:scale(1);
        text-shadow:
            0 0 8px #fff,
            0 0 20px #ffe000;
    }

    to{
        transform:scale(1.12);
        text-shadow:
            0 0 10px white,
            0 0 25px #fff000,
            0 0 50px #ff8c00,
            0 0 80px #ff2040;
    }
}


/* =====================================================
   GO BUTTON
===================================================== */

.button-wrap{
    display:flex;
    justify-content:center;

    margin-top:12px;
}

.go{
    position:relative;

    width:
        clamp(190px,32vw,270px);

    height:
        clamp(60px,9vw,78px);

    border:
        4px solid #edc85c;

    border-radius:14px;

    cursor:pointer;

    background:
        linear-gradient(
            180deg,
            #fff1a2,
            #e3ad2c 42%,
            #9a4c08
        );

    color:#3a0805;

    font-size:
        clamp(25px,4vw,36px);

    font-weight:1000;

    letter-spacing:7px;

    box-shadow:
        0 7px 0 #380d05,
        0 10px 25px rgba(0,0,0,.7),
        0 0 25px rgba(255,200,50,.35);

    transition:
        .08s;
}

.go:hover{
    filter:brightness(1.15);

    box-shadow:
        0 7px 0 #380d05,
        0 12px 35px rgba(0,0,0,.8),
        0 0 40px rgba(255,210,70,.65);
}

.go:active{
    transform:
        translateY(6px);
}

.go:disabled{
    cursor:not-allowed;

    filter:
        brightness(.55);
}


/* =====================================================
   JACKPOT OVERLAY
===================================================== */

.jackpot-overlay{
    position:fixed;

    inset:0;

    z-index:200;

    display:flex;

    justify-content:center;
    align-items:center;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(255,225,100,.45),
            rgba(255,20,50,.12) 40%,
            transparent 72%
        );
}

.jackpot-overlay.show{
    animation:
        jackpotOverlay 2.8s ease-out;
}

@keyframes jackpotOverlay{
    0%{
        opacity:0;
        transform:scale(.5);
    }

    12%{
        opacity:1;
        transform:scale(1.1);
    }

    25%{
        opacity:.65;
        transform:scale(1);
    }

    40%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(1.35);
    }
}


/* =====================================================
   BIG JACKPOT
===================================================== */

.big-jackpot{
    position:relative;

    text-align:center;

    transform:
        scale(.2)
        rotate(-5deg);

    opacity:0;
}

.jackpot-overlay.show
.big-jackpot{
    animation:
        jackpotPop 2.8s cubic-bezier(.1,.8,.2,1);
}

.big-jackpot .small{
    display:block;

    color:#fff3a0;

    font-size:
        clamp(18px,4vw,34px);

    letter-spacing:8px;

    font-weight:1000;
}

.big-jackpot .main{
    display:block;

    margin-top:5px;

    color:#fff;

    font-size:
        clamp(55px,12vw,150px);

    line-height:.85;

    font-weight:1000;

    font-style:italic;

    letter-spacing:-5px;

    text-shadow:
        0 4px 0 #8b4200,
        0 8px 0 #4d1800,
        0 0 10px white,
        0 0 30px #ffe000,
        0 0 60px #ff8c00,
        0 0 100px #ff174d;
}

@keyframes jackpotPop{

    0%{
        opacity:0;
        transform:
            scale(.15)
            rotate(-10deg);
    }

    10%{
        opacity:1;
        transform:
            scale(1.3)
            rotate(3deg);
    }

    18%{
        transform:
            scale(.9)
            rotate(-2deg);
    }

    27%{
        transform:
            scale(1.08)
            rotate(1deg);
    }

    38%{
        transform:
            scale(1)
            rotate(0);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            scale(1.2);
    }
}


/* =====================================================
   FLASH
===================================================== */

.flash{
    position:fixed;

    inset:0;

    z-index:150;

    pointer-events:none;

    opacity:0;
}

.flash.show{
    animation:
        screenFlash .45s ease-out;
}

@keyframes screenFlash{

    0%{
        opacity:0;
        background:#fff;
    }

    15%{
        opacity:.85;
    }

    100%{
        opacity:0;
    }
}


/* =====================================================
   COINS
===================================================== */

#particles{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:180;

    pointer-events:none;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:650px){

    .machine{
        padding:
            26px 8px 26px;

        border-width:4px;
    }

    .brand{
        letter-spacing:4px;
    }

    .subtitle{
        letter-spacing:2px;
    }

    .slot-frame{
        padding:6px;
        border-width:3px;
    }

    .slot-inner{
        padding:5px;
        border-width:2px;
    }

    .slots{
        gap:4px;
    }

    .slot{
        border-width:3px;
    }

    .lights{
        left:12px;
        right:12px;
    }

    .light{
        width:5px;
        height:5px;
    }
}
</style>

<script>

/* =====================================================
   SYMBOLS
===================================================== */

const SYMBOLS = [
    "🐉",
    "🐯",
    "🐢",
    "🔥"
];


/* =====================================================
   DOM
===================================================== */

const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2"),
    document.getElementById("reel3")
];

const slots = [
    document.getElementById("slot0"),
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];

const button =
    document.getElementById("go");

const result =
    document.getElementById("result");

const machine =
    document.getElementById("machine");

const overlay =
    document.getElementById("jackpotOverlay");

const flash =
    document.getElementById("flash");

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");


let spinning = false;

let audio = null;

let rollTimer = null;

let rollGain = null;

let particles = [];


/* =====================================================
   AUDIO
===================================================== */

function getAudio(){

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audio;
}


/* =====================================================
   ROLLING SOUND
===================================================== */

function startRollSound(){

    stopRollSound();

    const ac =
        getAudio();

    rollGain =
        ac.createGain();

    rollGain.gain.setValueAtTime(
        0.001,
        ac.currentTime
    );

    rollGain.gain.exponentialRampToValueAtTime(
        .08,
        ac.currentTime + .15
    );

    rollGain.connect(
        ac.destination
    );


    /*
     * 핵심:
     *
     * "뻥뻥"
     * 효과음이 아니다.
     *
     * 짧은 금속성 소리를 아주 빠르게
     * 이어 붙여서
     *
     * 도르르르르르르르르
     *
     * 하는 연속적인 릴 소리를 만든다.
     */

    rollTimer =
        setInterval(() => {

            if(!rollGain)
                return;

            const osc =
                ac.createOscillator();

            const gain =
                ac.createGain();


            osc.type =
                "square";


            /*
             * 낮은 금속음
             */

            osc.frequency.value =
                170 +
                Math.random() * 65;


            gain.gain.setValueAtTime(
                .0001,
                ac.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .035,
                ac.currentTime + .004
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                ac.currentTime + .035
            );


            osc.connect(gain);

            gain.connect(
                rollGain
            );


            osc.start();

            osc.stop(
                ac.currentTime + .04
            );

        }, 34);
}


/* =====================================================
   STOP ROLLING SOUND
===================================================== */

function stopRollSound(){

    if(rollTimer){

        clearInterval(
            rollTimer
        );

        rollTimer = null;
    }


    if(rollGain){

        const ac =
            getAudio();

        try{

            rollGain.gain.cancelScheduledValues(
                ac.currentTime
            );

            rollGain.gain.exponentialRampToValueAtTime(
                .0001,
                ac.currentTime + .18
            );

        }catch(e){}


        setTimeout(() => {

            try{

                if(rollGain)
                    rollGain.disconnect();

            }catch(e){}

            rollGain = null;

        },220);
    }
}


/* =====================================================
   REEL STOP SOUND
===================================================== */

function stopSound(){

    const ac =
        getAudio();


    /*
     * 릴이 걸리는 소리
     */

    const osc =
        ac.createOscillator();

    const gain =
        ac.createGain();


    osc.type =
        "triangle";


    osc.frequency.setValueAtTime(
        190,
        ac.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        75,
        ac.currentTime + .12
    );


    gain.gain.setValueAtTime(
        .13,
        ac.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ac.currentTime + .16
    );


    osc.connect(gain);

    gain.connect(
        ac.destination
    );


    osc.start();

    osc.stop(
        ac.currentTime + .17
    );
}


/* =====================================================
   JACKPOT MUSIC
===================================================== */

function jackpotSound(){

    const ac =
        getAudio();


    /*
     * 짧은 카지노 상승음
     */

    const notes = [
        392,
        523.25,
        659.25,
        783.99,
        1046.5,
        1318.5
    ];


    notes.forEach(
        (freq,index) => {

            const osc =
                ac.createOscillator();

            const gain =
                ac.createGain();


            const start =
                ac.currentTime +
                index * .12;


            osc.type =
                "sawtooth";

            osc.frequency.value =
                freq;


            gain.gain.setValueAtTime(
                .001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                .16,
                start + .025
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                start + .32
            );


            osc.connect(gain);

            gain.connect(
                ac.destination
            );


            osc.start(start);

            osc.stop(
                start + .35
            );

        }
    );


    /*
     * 마지막 팡파레
     */

    setTimeout(() => {

        const now =
            ac.currentTime;


        [523,659,784,1047].forEach(
            freq => {

                const osc =
                    ac.createOscillator();

                const gain =
                    ac.createGain();


                osc.type =
                    "triangle";

                osc.frequency.value =
                    freq;


                gain.gain.setValueAtTime(
                    .001,
                    now
                );

                gain.gain.exponentialRampToValueAtTime(
                    .12,
                    now + .03
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    now + .7
                );


                osc.connect(gain);

                gain.connect(
                    ac.destination
                );


                osc.start(now);

                osc.stop(
                    now + .75
                );

            }
        );

    },760);
}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


/* =====================================================
   RANDOM
===================================================== */

function randomSymbol(){

    return SYMBOLS[
        Math.floor(
            Math.random() *
            SYMBOLS.length
        )
    ];
}


/* =====================================================
   BUILD REEL
===================================================== */

function buildReel(
    reel,
    finalSymbol
){

    reel.innerHTML = "";

    const total =
        100;


    for(
        let i=0;
        i<total;
        i++
    ){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "symbol";


        div.textContent =
            i === total - 1
                ? finalSymbol
                : randomSymbol();


        reel.appendChild(div);
    }


    return total - 1;
}


/* =====================================================
   SPIN REEL
===================================================== */

function spinReel(
    index,
    finalSymbol,
    duration
){

    return new Promise(
        resolve => {

            const reel =
                reels[index];

            const slot =
                slots[index];


            const finalIndex =
                buildReel(
                    reel,
                    finalSymbol
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            const target =
                -(
                    (finalIndex - 1) *
                    height
                );


            const start =
                performance.now();


            slot.classList.add(
                "spinning"
            );


            function animate(time){

                const elapsed =
                    time - start;


                const progress =
                    Math.min(
                        elapsed /
                        duration,
                        1
                    );


                /*
                 * 빠르게 회전하다
                 * 끝에서 강하게 감속
                 */

                const eased =
                    1 -
                    Math.pow(
                        1-progress,
                        4
                    );


                const position =
                    target *
                    eased;


                reel.style.transform =
                    `translate3d(
                        0,
                        ${position}px,
                        0
                    )`;


                if(
                    progress < 1
                ){

                    requestAnimationFrame(
                        animate
                    );

                }else{

                    reel.style.transform =
                        `translate3d(
                            0,
                            ${target}px,
                            0
                        )`;


                    slot.classList.remove(
                        "spinning"
                    );


                    stopSound();


                    /*
                     * 살짝 튕기는
                     * 슬롯머신 느낌
                     */

                    reel.animate(
                        [
                            {
                                transform:
                                    `translate3d(
                                        0,
                                        ${target}px,
                                        0
                                    )`
                            },
                            {
                                transform:
                                    `translate3d(
                                        0,
                                        ${target+4}px,
                                        0
                                    )`
                            },
                            {
                                transform:
                                    `translate3d(
                                        0,
                                        ${target}px,
                                        0
                                    )`
                            }
                        ],
                        {
                            duration:220,
                            easing:
                                "ease-out"
                        }
                    );


                    resolve();
                }
            }


            requestAnimationFrame(
                animate
            );
        }
    );
}


/* =====================================================
   CANVAS
===================================================== */

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(

/* =====================================================
   COIN PARTICLES
===================================================== */

function createCoins(){

    const rect =
        machine.getBoundingClientRect();


    for(
        let i=0;
        i<220;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            Math.random() *
            13 + 5;


        particles.push({

            x:
                rect.left +
                rect.width/2,

            y:
                rect.top +
                rect.height/2,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random()*5+3,

            life:1,

            rotation:
                Math.random() *
                Math.PI,

            spin:
                Math.random()*.25+.08

        });
    }
}


/* =====================================================
   PARTICLE ANIMATION
===================================================== */

function particlesLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles =
        particles.filter(
            p =>
                p.life > 0
        );


    particles.forEach(
        p => {

            p.x += p.vx;

            p.y += p.vy;

            p.vy += .22;

            p.rotation +=
                p.spin;

            p.life -= .014;


            ctx.save();

            ctx.globalAlpha =
                p.life;

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(
                p.rotation
            );


            /*
             * 코인 느낌
             */

            ctx.fillStyle =
                "#ffd84a";


            ctx.fillRect(
                -p.size,
                -p.size*.55,
                p.size*2,
                p.size*1.1
            );


            ctx.strokeStyle =
                "#fff2a0";

            ctx.lineWidth =
                1;


            ctx.strokeRect(
                -p.size,
                -p.size*.55,
                p.size*2,
                p.size*1.1
            );


            ctx.restore();

        }
    );


    requestAnimationFrame(
        particlesLoop
    );
}

particlesLoop();


/* =====================================================

function jackpotEffect(){

    result.textContent =
        "🎉 당첨! JACKPOT! 🎉";


    result.classList.add(

            }

        }

}


/* =====================================================
   GAME
===================================================== */

async function startGame(){

    if(spinning)
        return;


    spinning = true;

    button.disabled =
        true;


    result.classList.remove(
        "jackpot"
    );


    result.textContent =
        "ROLLING...";


    const ac =
        getAudio();


    if(
        ac.state ===
        "suspended"
    ){

        await ac.resume();
    }


    /*
     * 결과
     */

    const results = [

        randomSymbol(),
        randomSymbol(),
        randomSymbol(),
        randomSymbol()

    ];


    /*
     * 도르르르르 시작
     */

    startRollSound();


    /*
     * 1
     */

    await spinReel(
        0,
        results[0],
        1400
    );


    await wait(100);


    /*
     * 2
     */

    await spinReel(
        1,
        results[1],
        1550
    );


    await wait(100);


    /*
     * 3
     */

    await spinReel(
        2,
        results[2],
        1700
    );


    await wait(100);


    /*
     * 4
     */

    await spinReel(
        3,
        results[3],
        1850
    );


    /*
     * 모든 릴 정지
     */

    stopRollSound();


    await wait(300);


    /*
     * JACKPOT
     */

    const jackpot =
        results.every(
            x =>
                x === results[0]
        );


    if(jackpot){

        jackpotEffect();

    }else{

        result.textContent =
            "NO JACKPOT — TRY AGAIN";

    }


    spinning =
        false;

    button.disabled =
        false;
}


/* =====================================================
   INITIAL
===================================================== */

function initialize(){

    const initial = [
        "🐉",
        "🐯",
        "🐢",
        "🔥"
    ];


    reels.forEach(
        (reel,index) => {

            const finalIndex =
                buildReel(
                    reel,
                    initial[index]
                );


            const symbol =
                reel.querySelector(
                    ".symbol"
                );


            const height =
                symbol.getBoundingClientRect()
                    .height;


            reel.style.transform =
                `translate3d(
                    0,
                    ${-(finalIndex-1)*height}px,
                    0
                )`;

        }
    );
}


/* =====================================================
   GO
===================================================== */

button.addEventListener(
    "click",
    startGame
);


initialize();
